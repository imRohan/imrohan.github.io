<!DOCTYPE html>
<!--Rohan Likhite-->
<html>

<head>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="http://i.imgur.com/XAC1eMO.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Rohan - {{ page.title }}</title>
    <meta name="viewport" content="width=device-width">

    <!-- syntax highlighting CSS -->
    <link rel="stylesheet" href="/css/syntax.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/hover.css">
    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/rrssb.css">

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="/css/responsive.css">

    <!-- Google Fonts -->
    <link href='http://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700' rel='stylesheet' type='text/css'>
    <link href='http://fonts.googleapis.com/css?family=Raleway:300,400,700' rel='stylesheet' type='text/css'>

    <!-- Font Awesome -->
    <link href="http://maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet">
</head>

<body>
    <div class="site">
        <div class="sidebar" id="sidebar">

            <div class="header ">
                <div class="logoBlocks">
                    <a href="/">
                        <div id="superLines"></div>
                        <div class="hvr-grow">
                            <div id="logoimage">
                                <img id="logo" src="/images/logo.png">
                            </div>
                    </a>
                    </div>
                </div>
                <span class="tagline">Hi, I'm Rohan. <br/>I  am a developer from Toronto, Canada</span>
            </div>
            <div class="footer">
                <span id="footer-links">
            <a href="" class="footer-link hvr-underline-reveal"><i class="fa fa-linkedin"></i> LinkedIn</a> <span class="separator">&bull;</span>
                <a href="https://twitter.com/RohanLikhite" class="footer-link hvr-underline-reveal"><i class="fa fa-twitter"></i> Twitter</a>  <span class="separator">&bull;</span>
                <a href="https://github.com/imRohan" class="footer-link hvr-underline-reveal"><i class="fa fa-github-alt"></i> GitHub</a>
                </span>
            </div>
            <div class="posts">
                <ul class="posts-list">
                    {% for post in site.posts %}
                    <li class="post-link">
                        <a class="post-title hvr-float" href="{{ post.url }}">
                            <span class="post-date">{{ post.date | date_to_string }}</span>
                            {{ post.title }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            </div>

        </div>

        {{ content }}

    </div>
    <script src="/scripts/rrssb.min.js" type="text/javascript"></script>

    <script src="/scripts/responsive.js" type="text/javascript"></script>
    <script src="/scripts/particles.js" type="text/javascript"></script>


    <script>
        var randomColor = '#' + (Math.random() * 0xFFFFFF << 0).toString(16);
        particlesJS('superLines', {
            particles: {
                color: randomColor,
                shape: 'circle',
                opacity: 1,
                size: 2.5,
                size_random: true,
                nb: Math.floor(Math.random() * 20) + 7,
                line_linked: {
                    enable_auto: true,
                    distance: 250,
                    color: '#242424',
                    opacity: 0.3,
                    width: 1,
                    condensed_mode: {
                        enable: false,
                        rotateX: 600,
                        rotateY: 600
                    }
                },
                anim: {
                    enable: true,
                    speed: 2.5
                }
            },
            interactivity: {
                enable: true,
                mouse: {
                    distance: 250
                },
                detect_on: 'canvas',
                mode: 'grab',
                line_linked: {
                    opacity: 0.5
                },
                events: {
                    onclick: {
                        push_particles: {
                            enable: true,
                            nb: 4
                        }
                    }
                }
            },
            retina_detect: true
        });
    </script>
</body>

</html>
